<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cartão de Ponto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151A;
    --panel:#1C2129;
    --panel-2:#252B35;
    --accent:#FFC53D;
    --accent-ink:#3A2C05;
    --green:#4ADE80;
    --red:#FF6B57;
    --blue:#5AA9E6;
    --text:#EEF1F5;
    --text-dim:#8C94A3;
    --border:#2E3542;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:#0A0C10; color:var(--text); font-family:var(--sans);
    display:flex; justify-content:center;
  }
  #shell{
    width:100%; max-width:460px; min-height:100vh; background:var(--bg);
    position:relative; padding-bottom:84px;
    box-shadow:0 0 60px rgba(0,0,0,0.5);
  }
  header{
    padding:22px 20px 14px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand svg{flex-shrink:0;}
  .brand-text h1{font-size:17px; margin:0; letter-spacing:0.5px; font-weight:700;}
  .brand-text p{font-size:11px; margin:0; color:var(--text-dim); letter-spacing:0.5px; text-transform:uppercase;}
  .clock-live{font-family:var(--mono); font-size:13px; color:var(--accent); font-weight:500;}

  #content{padding:18px 16px 10px;}

  /* ---- punch button ---- */
  .punch-wrap{display:flex; flex-direction:column; align-items:center; padding:18px 0 8px;}
  .punch-btn{
    width:168px; height:168px; border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, var(--panel-2), var(--panel));
    border:3px solid var(--accent);
    color:var(--text); font-family:var(--sans); font-weight:700;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    box-shadow:0 0 0 6px rgba(255,197,61,0.06), 0 20px 40px -12px rgba(0,0,0,0.6);
    transition:transform .12s ease;
  }
  .punch-btn:active{transform:scale(0.95);}
  .punch-btn.working{border-color:var(--green); box-shadow:0 0 0 6px rgba(74,222,128,0.08), 0 20px 40px -12px rgba(0,0,0,0.6);}
  .punch-btn .big-time{font-family:var(--mono); font-size:26px; letter-spacing:1px;}
  .punch-btn .label{font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim);}
  .punch-btn.working .label{color:var(--green);}
  .status-line{margin-top:14px; font-size:13px; color:var(--text-dim); text-align:center;}
  .status-line b{color:var(--text);}

  /* ---- today summary ---- */
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px;
    margin-bottom:14px;
  }
  .card h2{font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin:0 0 12px;}
  .row-between{display:flex; align-items:center; justify-content:space-between;}
  .stat{display:flex; flex-direction:column;}
  .stat .v{font-family:var(--mono); font-size:20px; font-weight:600;}
  .stat .k{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px;}
  .chip{
    display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:3px 8px; border-radius:20px;
    font-family:var(--mono); border:1px solid var(--border); color:var(--text-dim);
  }
  .chip.normal{color:var(--blue); border-color:rgba(90,169,230,0.3);}
  .chip.e50{color:var(--accent); border-color:rgba(255,197,61,0.3);}
  .chip.e60{color:#FF9F5A; border-color:rgba(255,159,90,0.3);}
  .chip.e100{color:var(--red); border-color:rgba(255,107,87,0.3);}
  .chip-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}

  /* ---- ticket / punch card ---- */
  .ticket{
    position:relative; background:var(--panel-2); border:1px dashed var(--border); border-radius:10px;
    padding:10px 14px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between;
  }
  .ticket:before, .ticket:after{
    content:""; position:absolute; width:12px; height:12px; background:var(--bg); border-radius:50%;
    top:50%; transform:translateY(-50%);
  }
  .ticket:before{left:-6px;} .ticket:after{right:-6px;}
  .ticket .t-left{display:flex; align-items:center; gap:10px;}
  .ticket .dot{width:8px; height:8px; border-radius:50%;}
  .ticket .dot.in{background:var(--green);}
  .ticket .dot.out{background:var(--red);}
  .ticket .t-time{font-family:var(--mono); font-size:15px;}
  .ticket .t-type{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px;}
  .ticket button{
    background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:14px; padding:4px;
  }
  .ticket button:hover{color:var(--red);}

  .empty{color:var(--text-dim); font-size:13px; text-align:center; padding:14px 0;}

  .add-manual{
    width:100%; padding:11px; border-radius:10px; border:1px solid var(--border); background:var(--panel-2);
    color:var(--text-dim); font-size:13px; font-family:var(--sans); cursor:pointer; margin-top:4px;
  }
  .manual-form{display:flex; gap:8px; margin-top:10px;}
  .manual-form select, .manual-form input{
    flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:9px 8px; font-family:var(--mono); font-size:13px;
  }
  .manual-form button{
    background:var(--accent); border:none; color:var(--accent-ink); font-weight:700; border-radius:8px; padding:0 14px;
    cursor:pointer; font-size:13px;
  }

  /* ---- history ---- */
  .month-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .month-nav button{
    background:var(--panel); border:1px solid var(--border); color:var(--text); width:34px; height:34px;
    border-radius:8px; cursor:pointer; font-size:16px;
  }
  .month-nav .m-label{font-weight:700; font-size:15px; text-transform:capitalize;}
  .day-row{
    display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-bottom:1px solid var(--border);
  }
  .day-row:last-child{border-bottom:none;}
  .day-left{display:flex; flex-direction:column;}
  .day-left .d-date{font-size:13px; font-weight:600;}
  .day-left .d-type{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px;}
  .day-right{text-align:right;}
  .day-right .d-hours{font-family:var(--mono); font-size:13px;}
  .day-right .d-val{font-size:12px; color:var(--accent); font-family:var(--mono);}
  .total-box{
    background:linear-gradient(135deg, var(--panel-2), var(--panel)); border:1px solid var(--accent);
    border-radius:14px; padding:18px; margin-bottom:16px;
  }
  .total-box .big-val{font-family:var(--mono); font-size:30px; font-weight:700; color:var(--accent);}
  .total-box .sub{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px;}
  .breakdown-line{display:flex; justify-content:space-between; font-size:12px; padding:5px 0; color:var(--text-dim); border-top:1px solid var(--border); margin-top:10px;}
  .breakdown-line span:last-child{font-family:var(--mono); color:var(--text);}

  /* ---- config ---- */
  .field{margin-bottom:16px;}
  .field label{font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:6px;}
  .field input{
    width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:10px;
    padding:11px 12px; font-family:var(--mono); font-size:14px;
  }
  .field .save-btn{
    margin-top:8px; background:var(--accent); border:none; color:var(--accent-ink); font-weight:700;
    padding:10px 16px; border-radius:10px; cursor:pointer; font-size:13px; width:100%;
  }
  .holiday-add{display:flex; gap:8px;}
  .holiday-add input{flex:1;}
  .holiday-add button{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:10px;
    padding:0 14px; cursor:pointer; font-size:16px;
  }
  .holiday-item{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .holiday-item:last-child{border-bottom:none;}
  .holiday-item button{background:none; border:none; color:var(--red); cursor:pointer;}
  .schedule-note{font-size:12px; color:var(--text-dim); line-height:1.6; background:var(--panel-2); border-radius:10px; padding:12px; border:1px solid var(--border);}
  .sched-list{display:flex; flex-direction:column;}
  .sched-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); gap:8px;}
  .sched-row:last-child{border-bottom:none;}
  .sched-day{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); flex-shrink:0;}
  .sched-day input[type="checkbox"]{width:16px; height:16px; accent-color:var(--accent);}
  .sched-times{display:flex; align-items:center; gap:6px;}
  .sched-times input[type="time"]{
    background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:6px 6px; font-family:var(--mono); font-size:12px; width:88px;
  }
  .sched-times input[type="time"]:disabled{opacity:0.35;}
  .sched-sep{color:var(--text-dim); font-size:12px;}
  .danger-btn{
    width:100%; background:none; border:1px solid var(--red); color:var(--red); padding:11px; border-radius:10px;
    font-size:13px; cursor:pointer; margin-top:6px;
  }

  /* ---- bottom nav ---- */
  nav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px;
    background:rgba(18,21,26,0.95); backdrop-filter:blur(10px); border-top:1px solid var(--border);
    display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  nav button{
    flex:1; background:none; border:none; color:var(--text-dim); font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; cursor:pointer; font-size:11px;
  }
  nav button.active{color:var(--accent);}
  nav button svg{width:20px; height:20px;}

  ::selection{background:var(--accent); color:var(--accent-ink);}
</style>
</head>
<body>
<div id="shell">
  <header>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9.5" stroke="#FFC53D" stroke-width="1.6"/>
        <path d="M12 7v5l3.5 2" stroke="#FFC53D" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div class="brand-text">
        <h1>PONTO</h1>
        <p>cartão digital</p>
      </div>
    </div>
    <div class="clock-live" id="liveClock">--:--:--</div>
  </header>
  <div id="content"></div>
  <nav>
    <button id="navHoje" onclick="setTab('hoje')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Hoje
    </button>
    <button id="navHist" onclick="setTab('historico')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/></svg>
      Histórico
    </button>
    <button id="navConfig" onclick="setTab('config')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V19.5a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H4.5a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H10a1.7 1.7 0 0 0 1-1.55V4.5a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V10a1.7 1.7 0 0 0 1.55 1h.19a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1z"/></svg>
      Ajustes
    </button>
  </nav>
</div>

<script>
/* ================= STATE & PERSISTENCE ================= */
const STORAGE_KEY = 'ponto-app-state-v1';
const DEFAULT_SCHEDULE = {
  0:{enabled:false, start:'07:00', end:'16:00'}, // domingo
  1:{enabled:true,  start:'07:00', end:'17:00'}, // segunda
  2:{enabled:true,  start:'07:00', end:'17:00'}, // terça
  3:{enabled:true,  start:'07:00', end:'17:00'}, // quarta
  4:{enabled:true,  start:'07:00', end:'17:00'}, // quinta
  5:{enabled:true,  start:'07:00', end:'16:00'}, // sexta
  6:{enabled:false, start:'07:00', end:'12:00'}  // sábado
};
let state = { rate: 7.44, punches: {}, holidays: {}, schedule: JSON.parse(JSON.stringify(DEFAULT_SCHEDULE)) };
let loaded = false;
let tab = 'hoje';
let historyMonth = new Date(); historyMonth.setDate(1);
let showManualForm = false;

/* ---- importação única das marcações do espelho de ponto (16/07 a 25/07/2026) ---- */
const SEED_KEY = 'seed_espelho_20260716_20260725';
const SEED_PUNCHES = {
  '2026-07-16': [{type:'in', hhmm:'07:04'}, {type:'out', hhmm:'20:15'}],
  '2026-07-17': [{type:'in', hhmm:'06:55'}, {type:'out', hhmm:'19:39'}],
  '2026-07-18': [{type:'in', hhmm:'07:07'}, {type:'out', hhmm:'18:14'}],
  '2026-07-20': [{type:'in', hhmm:'06:59'}, {type:'out', hhmm:'17:06'}],
  '2026-07-21': [{type:'in', hhmm:'07:00'}, {type:'out', hhmm:'19:23'}],
  '2026-07-22': [{type:'in', hhmm:'06:49'}, {type:'out', hhmm:'19:04'}],
  '2026-07-23': [{type:'in', hhmm:'06:45'}] // só entrada registrada no espelho
  // 19/07, 24/07 e 25/07 não tinham marcação no espelho
};
function applySeedPunches(){
  if(state[SEED_KEY]) return; // já importado antes, não repete
  let changed = false;
  Object.keys(SEED_PUNCHES).forEach(dateKey=>{
    if(state.punches[dateKey] && state.punches[dateKey].length) return; // não sobrescreve dia já preenchido
    const entries = SEED_PUNCHES[dateKey].map(p=>{
      const [hh,mm] = p.hhmm.split(':').map(Number);
      const d = new Date(dateKey+'T00:00:00');
      d.setHours(hh, mm, 0, 0);
      return {id: Date.now()+'-'+Math.random().toString(36).slice(2,7), type:p.type, time:d.getTime()};
    });
    state.punches[dateKey] = entries;
    changed = true;
  });
  state[SEED_KEY] = true;
  if(changed) saveState();
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = Object.assign({rate:7.44, punches:{}, holidays:{}, schedule: JSON.parse(JSON.stringify(DEFAULT_SCHEDULE))}, parsed);
      const mergedSchedule = JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
      if(parsed.schedule){
        Object.keys(mergedSchedule).forEach(dow=>{
          if(parsed.schedule[dow]) mergedSchedule[dow] = Object.assign({}, mergedSchedule[dow], parsed.schedule[dow]);
        });
      }
      state.schedule = mergedSchedule;
    }
  }catch(e){ /* no data yet */ }
  applySeedPunches();
  loaded = true;
  render();
}

let saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    }catch(e){ console.error('Falha ao salvar', e); }
  }, 200);
}

/* ================= HELPERS ================= */
function pad(n){ return n.toString().padStart(2,'0'); }
function dateKeyFromDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayKey(){ return dateKeyFromDate(new Date()); }
function timeStr(ts){ const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtHours(h){
  const sign = h<0 ? '-' : '';
  h = Math.abs(h);
  const hh = Math.floor(h);
  const mm = Math.round((h-hh)*60);
  return `${sign}${hh}h${pad(mm)}`;
}
function fmtMoney(v){ return 'R$ ' + v.toFixed(2).replace('.', ','); }
function dayOfWeek(dateKey){ return new Date(dateKey+'T00:00:00').getDay(); } // 0=Dom..6=Sab
const WEEKDAY_LABEL = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const WEEKDAY_SHORT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTH_LABEL = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function timeToMinutes(t){ const [h,m] = (t||'0:0').split(':').map(Number); return h*60+m; }

function expectedHours(dateKey){
  const dow = dayOfWeek(dateKey);
  const s = state.schedule[dow];
  if(!s || !s.enabled) return 0;
  const mins = timeToMinutes(s.end) - timeToMinutes(s.start);
  return Math.max(0, mins/60);
}
function dayType(dateKey){
  if(state.holidays[dateKey]) return 'holiday';
  const dow = dayOfWeek(dateKey);
  const s = state.schedule[dow];
  if(s && s.enabled) return 'weekday';
  if(dow===0) return 'sunday';
  return 'restday'; // dia não escalado (ex: sábado ou qualquer dia desmarcado na jornada)
}
const TYPE_LABEL = {weekday:'Dia útil', restday:'Dia de folga', sunday:'Domingo', holiday:'Feriado'};

// pairs punches for a day, returns worked hours + breakdown + list sorted + openSince (if odd count & day is today)
function computeDay(dateKey){
  const list = (state.punches[dateKey] || []).slice().sort((a,b)=>a.time-b.time);
  let workedMs = 0;
  let openSince = null;
  for(let i=0;i<list.length;i+=2){
    const inP = list[i];
    const outP = list[i+1];
    if(outP){
      workedMs += (outP.time - inP.time);
    } else {
      // unmatched last punch
      if(dateKey === todayKey()){
        openSince = inP.time;
      }
    }
  }
  let workedHoursBase = workedMs/3600000;
  let liveExtra = 0;
  if(openSince){
    liveExtra = (Date.now() - openSince)/3600000;
  }
  const worked = workedHoursBase + liveExtra;

  const type = dayType(dateKey);
  let normalH=0, e50=0, e60=0, e100=0;
  if(type === 'weekday'){
    const exp = expectedHours(dateKey);
    normalH = Math.min(worked, exp);
    e50 = Math.max(0, worked - exp);
  } else if(type === 'restday'){
    e60 = worked;
  } else { // sunday or holiday
    e100 = worked;
  }
  const rate = state.rate;
  const value = normalH*rate + e50*rate*1.5 + e60*rate*1.6 + e100*rate*2.0;
  return {list, worked, normalH, e50, e60, e100, value, type, openSince};
}

function allDatesSorted(){
  return Object.keys(state.punches).filter(k=>state.punches[k] && state.punches[k].length).sort();
}

function monthKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }

/* ================= ACTIONS ================= */
function doPunch(){
  const key = todayKey();
  if(!state.punches[key]) state.punches[key] = [];
  const list = state.punches[key];
  const nextType = (list.length % 2 === 0) ? 'in' : 'out';
  list.push({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), type: nextType, time: Date.now()});
  saveState();
  render();
}

function deletePunch(dateKey, id){
  state.punches[dateKey] = (state.punches[dateKey]||[]).filter(p=>p.id!==id);
  if(state.punches[dateKey].length===0) delete state.punches[dateKey];
  saveState();
  render();
}

function addManualPunch(dateKey, timeVal, type){
  if(!timeVal) return;
  const [hh,mm] = timeVal.split(':').map(Number);
  const d = new Date(dateKey+'T00:00:00');
  d.setHours(hh, mm, 0, 0);
  if(!state.punches[dateKey]) state.punches[dateKey] = [];
  state.punches[dateKey].push({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), type, time: d.getTime()});
  saveState();
  showManualForm = false;
  render();
}

function setRate(v){
  const n = parseFloat((v+'').replace(',','.'));
  if(!isNaN(n) && n>0){ state.rate = n; saveState(); }
  render();
}

function addHoliday(dateVal){
  if(!dateVal) return;
  state.holidays[dateVal] = true;
  saveState();
  render();
}
function removeHoliday(dateVal){
  delete state.holidays[dateVal];
  saveState();
  render();
}

function resetAll(){
  if(confirm('Isso vai apagar todas as marcações, feriados e configurações. Confirmar?')){
    state = {rate:7.44, punches:{}, holidays:{}, schedule: JSON.parse(JSON.stringify(DEFAULT_SCHEDULE))};
    saveState();
    render();
  }
}

function toggleSchedInputs(dow){
  const enabled = document.getElementById('schedEnabled'+dow).checked;
  document.getElementById('schedStart'+dow).disabled = !enabled;
  document.getElementById('schedEnd'+dow).disabled = !enabled;
}

function saveSchedule(){
  const newSchedule = {};
  let error = false;
  [0,1,2,3,4,5,6].forEach(dow=>{
    const enabled = document.getElementById('schedEnabled'+dow).checked;
    const start = document.getElementById('schedStart'+dow).value || '00:00';
    const end = document.getElementById('schedEnd'+dow).value || '00:00';
    if(enabled && timeToMinutes(end) <= timeToMinutes(start)) error = true;
    newSchedule[dow] = {enabled, start, end};
  });
  if(error){
    alert('Em cada dia marcado, o horário final precisa ser depois do horário inicial.');
    return;
  }
  state.schedule = newSchedule;
  saveState();
  render();
}

function setTab(t){ tab = t; showManualForm=false; render(); }
function shiftMonth(delta){
  historyMonth.setMonth(historyMonth.getMonth()+delta);
  render();
}

/* ================= RENDER ================= */
function render(){
  document.getElementById('navHoje').classList.toggle('active', tab==='hoje');
  document.getElementById('navHist').classList.toggle('active', tab==='historico');
  document.getElementById('navConfig').classList.toggle('active', tab==='config');
  const el = document.getElementById('content');
  if(!loaded){ el.innerHTML = '<div class="empty">Carregando…</div>'; return; }
  if(tab==='hoje') el.innerHTML = renderHoje();
  else if(tab==='historico') el.innerHTML = renderHistorico();
  else el.innerHTML = renderConfig();
}

function renderHoje(){
  const key = todayKey();
  const d = computeDay(key);
  const nextIsIn = (state.punches[key]||[]).length % 2 === 0;
  const now = new Date();
  const nowStr = `${pad(now.getHours())}:${pad(now.getMinutes())}`;

  let ticketsHtml = '';
  if(d.list.length===0){
    ticketsHtml = '<div class="empty">Nenhuma marcação hoje ainda.</div>';
  } else {
    ticketsHtml = d.list.map(p=>`
      <div class="ticket">
        <div class="t-left">
          <span class="dot ${p.type}"></span>
          <div>
            <div class="t-time">${timeStr(p.time)}</div>
            <div class="t-type">${p.type==='in'?'Entrada':'Saída'}</div>
          </div>
        </div>
        <button onclick="deletePunch('${key}','${p.id}')" title="Remover">✕</button>
      </div>
    `).join('');
  }

  const manualHtml = showManualForm ? `
    <div class="manual-form">
      <select id="manType"><option value="in">Entrada</option><option value="out">Saída</option></select>
      <input type="time" id="manTime" value="${nowStr}">
      <button onclick="addManualPunch('${key}', document.getElementById('manTime').value, document.getElementById('manType').value)">OK</button>
    </div>` : '';

  return `
    <div class="punch-wrap">
      <button class="punch-btn ${nextIsIn?'':'working'}" onclick="doPunch()">
        <div class="big-time">${nowStr}</div>
        <div class="label">${nextIsIn?'Marcar entrada':'Marcar saída'}</div>
      </button>
      <div class="status-line">${d.openSince ? `Trabalhando desde <b>${timeStr(d.openSince)}</b>` : (d.list.length? 'Expediente encerrado por enquanto' : 'Toque para bater o primeiro ponto do dia')}</div>
    </div>

    <div class="card">
      <h2>Resumo de hoje · ${TYPE_LABEL[d.type]}</h2>
      <div class="row-between">
        <div class="stat"><div class="v">${fmtHours(d.worked)}</div><div class="k">trabalhadas</div></div>
        <div class="stat" style="text-align:right"><div class="v">${fmtMoney(d.value)}</div><div class="k">a receber</div></div>
      </div>
      <div class="chip-row">
        ${d.normalH>0?`<span class="chip normal">Normal ${fmtHours(d.normalH)}</span>`:''}
        ${d.e50>0?`<span class="chip e50">+50% ${fmtHours(d.e50)}</span>`:''}
        ${d.e60>0?`<span class="chip e60">+60% ${fmtHours(d.e60)}</span>`:''}
        ${d.e100>0?`<span class="chip e100">+100% ${fmtHours(d.e100)}</span>`:''}
        ${(d.normalH===0&&d.e50===0&&d.e60===0&&d.e100===0)?'<span class="chip">Sem horas ainda</span>':''}
      </div>
    </div>

    <div class="card">
      <h2>Marcações de hoje</h2>
      ${ticketsHtml}
      ${manualHtml}
      <button class="add-manual" onclick="showManualForm=!showManualForm; render();">${showManualForm?'Cancelar':'+ Adicionar marcação manual'}</button>
    </div>
  `;
}

function renderHistorico(){
  const y = historyMonth.getFullYear(), m = historyMonth.getMonth();
  const mk = monthKey(historyMonth);
  const dates = allDatesSorted().filter(k=>k.startsWith(mk));

  let normalH=0,e50=0,e60=0,e100=0,total=0,workedTotal=0;
  const rows = dates.map(k=>{
    const d = computeDay(k);
    normalH+=d.normalH; e50+=d.e50; e60+=d.e60; e100+=d.e100; total+=d.value; workedTotal+=d.worked;
    const dow = dayOfWeek(k);
    const dnum = k.split('-')[2];
    return `<div class="day-row">
      <div class="day-left">
        <div class="d-date">${WEEKDAY_SHORT[dow]} ${dnum}</div>
        <div class="d-type">${TYPE_LABEL[d.type]}</div>
      </div>
      <div class="day-right">
        <div class="d-hours">${fmtHours(d.worked)}</div>
        <div class="d-val">${fmtMoney(d.value)}</div>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="month-nav">
      <button onclick="shiftMonth(-1)">‹</button>
      <div class="m-label">${MONTH_LABEL[m]} ${y}</div>
      <button onclick="shiftMonth(1)">›</button>
    </div>

    <div class="total-box">
      <div class="big-val">${fmtMoney(total)}</div>
      <div class="sub">total do mês · ${fmtHours(workedTotal)} trabalhadas</div>
      <div class="breakdown-line"><span>Horas normais</span><span>${fmtHours(normalH)} · ${fmtMoney(normalH*state.rate)}</span></div>
      <div class="breakdown-line"><span>Extra 50% (além da jornada)</span><span>${fmtHours(e50)} · ${fmtMoney(e50*state.rate*1.5)}</span></div>
      <div class="breakdown-line"><span>Extra 60% (dia de folga)</span><span>${fmtHours(e60)} · ${fmtMoney(e60*state.rate*1.6)}</span></div>
      <div class="breakdown-line"><span>Extra 100% (dom/feriado)</span><span>${fmtHours(e100)} · ${fmtMoney(e100*state.rate*2)}</span></div>
    </div>

    <div class="card">
      <h2>Dias com marcação</h2>
      ${dates.length? rows : '<div class="empty">Nenhuma marcação neste mês.</div>'}
    </div>
  `;
}

function renderConfig(){
  const holidayEntries = Object.keys(state.holidays).sort();
  const holidaysHtml = holidayEntries.length ? holidayEntries.map(h=>`
    <div class="holiday-item">
      <span>${h.split('-').reverse().join('/')}</span>
      <button onclick="removeHoliday('${h}')">Remover</button>
    </div>`).join('') : '<div class="empty">Nenhum feriado cadastrado.</div>';

  const dayOrder = [1,2,3,4,5,6,0]; // segunda ... domingo
  const scheduleRows = dayOrder.map(dow=>{
    const s = state.schedule[dow];
    return `
      <div class="sched-row">
        <label class="sched-day">
          <input type="checkbox" id="schedEnabled${dow}" ${s.enabled?'checked':''} onchange="toggleSchedInputs(${dow})">
          <span>${WEEKDAY_LABEL[dow]}</span>
        </label>
        <div class="sched-times">
          <input type="time" id="schedStart${dow}" value="${s.start}" ${s.enabled?'':'disabled'}>
          <span class="sched-sep">–</span>
          <input type="time" id="schedEnd${dow}" value="${s.end}" ${s.enabled?'':'disabled'}>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="card">
      <h2>Valor da hora</h2>
      <div class="field">
        <label>Valor por hora (R$)</label>
        <input type="text" inputmode="decimal" id="rateInput" value="${state.rate.toFixed(2)}">
        <button class="save-btn" onclick="setRate(document.getElementById('rateInput').value)">Salvar valor da hora</button>
      </div>
    </div>

    <div class="card">
      <h2>Jornada de trabalho</h2>
      <div class="sched-list">${scheduleRows}</div>
      <button class="save-btn" onclick="saveSchedule()">Salvar jornada</button>
      <div class="schedule-note" style="margin-top:12px">
        Marque os dias em que você trabalha normalmente e o horário de cada um.<br>
        Dia marcado: horas dentro do horário = normal, além dele = extra a 50%.<br>
        Domingo desmarcado: qualquer hora trabalhada = extra a 100%.<br>
        Outros dias desmarcados (ex.: sábado): extra a 60%, se você bater ponto.<br>
        Feriados cadastrados sempre valem extra a 100%, mesmo em dia marcado.
      </div>
    </div>

    <div class="card">
      <h2>Feriados</h2>
      <div class="holiday-add">
        <input type="date" id="holidayInput">
        <button onclick="addHoliday(document.getElementById('holidayInput').value)">+</button>
      </div>
      <div style="margin-top:10px">${holidaysHtml}</div>
    </div>

    <div class="card">
      <h2>Dados</h2>
      <button class="danger-btn" onclick="resetAll()">Apagar todos os dados</button>
    </div>
  `;
}

/* ================= LIVE CLOCK ================= */
function tickClock(){
  const now = new Date();
  document.getElementById('liveClock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  if(tab==='hoje') render();
}
setInterval(tickClock, 1000);
tickClock();

loadState();
</script>
</body>
</html>
